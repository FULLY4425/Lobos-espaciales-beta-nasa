name: Prueba de integración KSP
description: Experiencias, logs, errores y mejoras de pruebas con KSP real.
title: "[KSP][PRUEBA] "
body:
  - type: markdown
    attributes:
      value: |
        Esta bitácora es exclusiva para pruebas de la integración con una partida real de KSP 1.
        Puedes preparar el informe en https://lobos-espaciales-python.onrender.com/ksp-tests.html.
        Los reportes y adjuntos son públicos. Revisa los logs antes de adjuntarlos.
  - type: checkboxes
    id: scope
    attributes:
      label: Alcance de la prueba
      options:
        - label: Probé la integración con una partida real de KSP; no es solo la demo, AR o el explorador de Marte.
          required: true
  - type: input
    id: ksp-version
    attributes:
      label: Versión de KSP
      placeholder: KSP 1.12.5, Steam
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Área de integración probada
      options:
        - Mapa nativo KSP
        - HUD de entrenamiento conectado a KSP
        - Mapas importados con KSP / SCANsat
        - Conector kRPC y telemetría
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Resultado general
      options:
        - Funcionó
        - Funcionó parcialmente
        - Prueba bloqueada
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Informe detallado
      description: Pega el informe preparado en la web o completa entorno, versión/commit, kRPC, mods, cuerpo, vehículo, pasos, resultado esperado/observado, incidencias y matriz de comprobaciones.
      placeholder: Describe una sesión real y los pasos necesarios para repetirla. Indica qué no pudiste probar.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs y evidencias adjuntas
      description: Arrastra aquí KSP.log, el log del conector, archivos .txt/.json revisados, capturas o un ZIP. Espera a que GitHub termine de subirlos. Relaciona los errores con sus horas y pasos. Si un log no pudo obtenerse, explica el motivo y aporta las otras evidencias disponibles.
      placeholder: Adjunta los archivos aquí y explica qué demuestra cada uno. Las capturas del navegador no reemplazan el log del conector cuando está disponible.
    validations:
      required: true
  - type: textarea
    id: improvements
    attributes:
      label: Mejoras y sugerencias
      description: Explica el cambio propuesto, su utilidad y prioridad. También puedes indicar que no tienes sugerencias.
    validations:
      required: true
